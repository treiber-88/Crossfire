Selectable: False

MapFormat: 6

RequiresMod: crossfire

Title: Mission 01: Liberation

Description: Pakistan has captured our outpost near the Arabian sea in a surprise attack. This move was mainly to secure the various oil derricks in the area to fuel its war effort. Your mission is to liberate the outpost and capture these derricks. We will be sending an MCV on 7 minute mark, so use it wisely.\n\nWe have also lost contact with our various scouts that we sent in this area. They have likely been captured so keep a look out for any holding facilities.\n\nOnce you have secured the area by eliminating Pakistani presence on our side of the sea, you are to clear the sea for any Pakistani ships. We will then send our missile subs to take out the forward Pakistani airbase in this region.

